[package]
name = "nekonoverse-backend-rs"
version.workspace = true
edition.workspace = true

[lib]
name = "nekonoverse_backend_rs"
path = "src/lib.rs"

[[bin]]
name = "nekonoverse-backend-rs"
path = "src/main.rs"

[dependencies]
nekonoverse-core = { path = "../rust-core" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tokio-stream = { version = "0.1", features = ["net"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
url = "2"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = "2"
base64 = "0.22"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
bcrypt = "0.15"
sha1 = "0.10"
rand = "0.8"
p256 = "0.13"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
rand = "0.8"
wiremock = "0.6"
