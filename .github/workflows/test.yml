name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: neko-e2e

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nekonoverse
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nekonoverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Rust native extension (via Docker, no local Rust toolchain)
        run: |
          docker run --rm \
            -v "$PWD/backend/Cargo.toml:/workspace/Cargo.toml" \
            -v "$PWD/backend/Cargo.lock:/workspace/Cargo.lock" \
            -v "$PWD/backend/rust-core:/workspace/rust-core" \
            -v "$PWD/backend/native:/workspace/native" \
            -v "$PWD/backend/backend-rs/Cargo.toml:/workspace/backend-rs/Cargo.toml" \
            -v "$PWD/backend/native/dist:/wheels" \
            --entrypoint sh ghcr.io/pyo3/maturin -c '
              mkdir -p /workspace/backend-rs/src &&
              echo "fn main() {}" > /workspace/backend-rs/src/main.rs &&
              echo "" > /workspace/backend-rs/src/lib.rs &&
              maturin build --release --manifest-path /workspace/native/Cargo.toml -o /wheels -i /opt/python/cp312-cp312/bin/python3.12
            '

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install native/dist/*.whl

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/

      - name: Run tests (shard ${{ matrix.shard }}/4)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@localhost:5432/nekonoverse_test
          VALKEY_URL: valkey://localhost:6379/1
          DOMAIN: localhost
          SECRET_KEY: test-secret-key
          DEBUG: "true"
          REGISTRATION_OPEN: "true"
        run: python -m pytest tests/ -v -n auto --shard-id=${{ matrix.shard }} --num-shards=4

  backend-rs-test:
    # 完全Rust化ロードマップ (strangler fig) の backend-rs (axum サービス) 用。
    # native (PyO3 拡張) は Python インタプリタが無いとビルドスクリプトすら
    # 実行できないため、workspace から明示的に除外する
    # (native 自体の検証は backend-test ジョブの pytest 側で行われる)。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nekonoverse
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nekonoverse_rs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nekonoverse:testpass@localhost:5432/nekonoverse_rs_test
      VALKEY_URL: redis://localhost:6379/0
      DOMAIN: localhost
      # TOTPリカバリーコードのbcryptハッシュ化(8件、本番はコスト12)を結合テストで
      # 都度行うと無視できない実行時間になるため、CIでは最小コストに短縮する
      # (`backend-rs/src/config.rs`の`bcrypt_cost`、本番の実際のセキュリティ
      # パラメータには影響しない)。
      BCRYPT_COST: "4"
      # TOTP secretのFernetキー導出(PBKDF2-HMAC-SHA256、本番は60万回)。
      # RustCrypto系の実装はデバッグビルド(`cargo test`はデフォルトでデバッグ
      # ビルド)だと最適化ビルドの10倍以上遅く、結合テストで都度実行すると
      # 無視できない実行時間になるため短縮する(`totp_pbkdf2_iterations`、
      # 本番の実際のセキュリティパラメータには影響しない)。
      TOTP_PBKDF2_ITERATIONS: "1000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply database migrations (alembic)
        # スキーマは Alembic が唯一の DDL 権限を持つ (Issue #1139)。backend-rs の
        # 結合テストは webfinger 等で実テーブルを読み書きするため、cargo test の
        # 前に本番と同じ経路でスキーマを構築しておく。
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@localhost:5432/nekonoverse_rs_test
          DOMAIN: localhost
          SECRET_KEY: test-secret-key
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=. alembic upgrade head

      - name: cargo fmt --check
        run: |
          docker run --rm -v "$PWD/backend:/workspace" -w /workspace \
            rust:1-slim sh -c "rustup component add rustfmt && cargo fmt --check --package nekonoverse-core --package nekonoverse-backend-rs"

      - name: cargo clippy
        run: |
          docker run --rm -v "$PWD/backend:/workspace" -w /workspace \
            rust:1-slim sh -c "rustup component add clippy && cargo clippy --workspace --exclude nekonoverse-native --all-targets -- -D warnings"

      - name: cargo test
        run: |
          docker run --rm --network host -v "$PWD/backend:/workspace" -w /workspace \
            -e DATABASE_URL -e VALKEY_URL -e DOMAIN -e BCRYPT_COST -e TOTP_PBKDF2_ITERATIONS \
            rust:1-slim cargo test --workspace --exclude nekonoverse-native

  alembic-migration:
    # 実 PostgreSQL に対して `alembic upgrade head` → `downgrade base` → `upgrade head`
    # の往復を実行し、migration の構文ミス・revision chain の不整合・autocommit_block
    # + CONCURRENTLY 系の互換性を検出する。pytest は Base.metadata.create_all で初期化
    # するため migration 自体は走らない (#1044)。
    runs-on: ubuntu-latest
    name: Alembic migration roundtrip
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nekonoverse
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nekonoverse_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@localhost:5432/nekonoverse_mig
      DOMAIN: localhost
      SECRET_KEY: test-secret-key
      DEBUG: "true"
      # 注: valkey service は不要 (alembic は Valkey に接続しない)。
      #     env.py が将来 Valkey 接続を import した場合に備えて URL は設定しない。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: alembic upgrade head
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head

      - name: alembic downgrade base (full reverse)
        working-directory: backend
        run: PYTHONPATH=. alembic downgrade base

      - name: alembic upgrade head (re-apply)
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `driver: docker` を使うとDocker Engine組み込みのBuildKitをそのまま使い、
      # 別途 `moby/buildkit:buildx-stable-1` イメージをDocker Hubから
      # pullする専用builderコンテナを作らずに済む。このジョブは
      # `docker compose build` のみでキャッシュ共有やマルチプラットフォーム
      # ビルドを使わないため、デフォルトの `docker-container` driverが必要な
      # 機能には依存しておらず、切り替えても挙動は変わらない
      # (Docker Hubからの一時的な接続断でこのbuilder自体のpullが失敗し、
      # ジョブ全体がこけていたのを回避する)。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build images
        run: docker compose -f docker-compose.e2e.yml build
        env:
          DOCKER_BUILDKIT: "1"

      - name: Save images
        run: |
          docker save neko-e2e-app neko-e2e-frontend neko-e2e-worker | gzip > /tmp/e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: e2e-images
          path: /tmp/e2e-images.tar.gz
          retention-days: 1
          compression-level: 0

  e2e-test:
    runs-on: ubuntu-latest
    needs: e2e-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: /tmp

      - name: Load images
        run: docker load < /tmp/e2e-images.tar.gz

      - name: Start services
        run: docker compose -f docker-compose.e2e.yml up -d --wait
        timeout-minutes: 5

      - name: Verify API is ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3080/api/v1/health > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API not ready after 30s"
          docker compose -f docker-compose.e2e.yml logs app nginx
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        working-directory: tests/e2e
        run: npx playwright test --project=chromium --project=mobile-chromium --shard=${{ matrix.shard }}/3

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: tests/e2e/test-results/

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  mastodon-client-test:
    runs-on: ubuntu-latest
    needs: e2e-build
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: neko-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: /tmp

      - name: Load images
        run: docker load < /tmp/e2e-images.tar.gz

      - name: Build test-runner
        run: docker compose -f docker-compose.mastodon-client-test.yml build test-runner

      - name: Start services
        run: docker compose -f docker-compose.mastodon-client-test.yml up -d --wait
        timeout-minutes: 5

      - name: Run mastodon-client tests
        run: docker compose -f docker-compose.mastodon-client-test.yml run --rm test-runner

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.mastodon-client-test.yml down -v
