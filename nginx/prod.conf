events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/activity+json application/ld+json;
    gzip_min_length 1000;

    upstream backend {
        server unix:/var/run/nekonoverse-app/uvicorn.sock;
        keepalive 32;
    }

    # 完全Rust化ロードマップ (strangler fig): パス単位で backend-rs へ
    # 段階的に切り替えていく。Stage 1: /api/v1/health のみ。
    upstream backend-rs {
        server unix:/var/run/nekonoverse-app-rs/app-rs.sock;
        keepalive 32;
    }

    upstream s3proxy-deliverer {
        server unix:/var/run/s3proxy-deliverer/uvicorn.sock;
        keepalive 32;
    }

    map $http_x_forwarded_proto $redirect_https {
        "https" 0;
        default 1;
    }

    # 前段プロキシ (cloudflared / Tailscale Serve 等) が付与した X-Forwarded-For から
    # クライアント IP を復元する。信頼するのは Docker 内部ネットワーク等のプロキシのみで、
    # 外部から直接届いたリクエストの X-Forwarded-For は無視される。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # アプリ (uvicorn) は X-Forwarded-For の先頭をクライアント IP とみなすため、
    # 各 location では復元済みの $remote_addr だけを X-Forwarded-For として渡す。

    # M-5: セキュリティヘッダー
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; media-src 'self' https:; connect-src 'self' wss: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:; object-src 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Static frontend files
        root /var/www/frontend;

        # Direct HTTP access -> redirect to HTTPS
        # Cloudflared / Tailscale Serve sets X-Forwarded-Proto: https
        if ($redirect_https) {
            return 301 https://$host$request_uri;
        }

        # SSE streaming - no buffering, long timeout
        location /api/v1/streaming/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 4。admin.pyのdomain_blocks系
        # (一覧/作成/削除)。他の管理エンドポイントは引き続きPython側。
        location = /api/v1/admin/domain_blocks {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/admin/domain_blocks/[^/]+$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyの通報系(一覧/解決/却下)。
        location = /api/v1/admin/reports {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/admin/reports/[^/]+/(resolve|reject)$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyの投稿モデレーション系(削除/強制センシティブ)。
        location ~ ^/api/v1/admin/notes/[^/]+/sensitive$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/admin/notes/[^/]+$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyのモデレーションログ。
        location = /api/v1/admin/log {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyのロール管理系(一覧/取得/作成/更新/削除)。
        location = /api/v1/admin/roles {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/admin/roles/[^/]+$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyのレガシーのモデレーター権限ショートカット。
        location = /api/v1/admin/permissions {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # admin.pyのユーザー管理系(一覧/ロール変更/停止/停止解除/サイレンス/
        # サイレンス解除)。アカウント即時削除(.../users/{id}/delete)は
        # 引き続きPython側。
        location = /api/v1/admin/users {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/admin/users/[^/]+/(role|suspend|unsuspend|silence|unsilence)$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Admin API — 大きいZIPインポートを許可
        location /api/v1/admin/ {
            client_max_body_size 100M;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Media upload — 動画アップロード用に大きいサイズを許可
        location ~ ^/api/v[12]/media {
            client_max_body_size 50M;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 1。
        # location = (完全一致) は他の全てのマッチ規則より優先されるため、
        # 下の広い location /api/ ブロックの位置を変えずにこのパスだけ
        # backend-rs へ切り出せる。
        location = /api/v1/health {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /.well-known/webfinger {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /.well-known/host-meta {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /.well-known/nodeinfo {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /nodeinfo/2.0 {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 2。外部ネットワークに
        # 出る初めてのエンドポイント (メディアの取得元は連合先が任意に指定)。
        location = /api/v1/media/proxy {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 4。create_status
        # (POST /api/v1/statuses、note_idを含まない完全一致パス)。
        location = /api/v1/statuses {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 3。note_id が動的な
        # パスのため location = (完全一致) が使えず正規表現を使う。
        # 正規表現 location は longest-prefix の location /api/ より優先される。
        location ~ ^/api/v1/statuses/[^/]+/(un)?bookmark$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ~ ^/api/v1/authorized_apps(/[^/]+)?$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 4, 最初の垂直スライス。
        location ~ ^/api/v1/statuses/[^/]+/(un)?pin$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # unreblog_status/reblog_status。
        location ~ ^/api/v1/statuses/[^/]+/(un)?reblog$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # get_status_history (GET)。note_idを含む動的パスのため正規表現を使う。
        location ~ ^/api/v1/statuses/[^/]+/history$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # get_status(GET)/delete_status(DELETE)/edit_status(PUT)をbackend-rsへ
        # (/notes/ のcontent-negotiationと同じ、メソッドで分岐するif+breakの手法)。
        location ~ ^/api/v1/statuses/[^/]+$ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            if ($request_method ~ ^(GET|PUT|DELETE)$) {
                proxy_pass http://backend-rs;
                break;
            }

            proxy_pass http://backend;
        }

        # verify_credentials (app/api/auth.py)。ノートの可視性判定や連合配送を
        # 伴わない、認証済み本人自身の情報を返すだけの読み取り専用エンドポイント。
        location = /api/v1/accounts/verify_credentials {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # TOTP二要素認証 (app/api/auth.py)。POST /auth/login (1段階目、未移植) は
        # 引き続きPython側だが、Valkeyのセッション/保留トークンを共有しているため
        # 問題なく連携する(routes/auth.rs冒頭のコメント参照)。
        location ~ ^/api/v1/auth/totp/(setup|enable|disable|verify|status)$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # list_followers/list_following/get_relationship。lookup_account/search_accounts は
        # WebFinger 解決を要するため引き続きPython側。
        location ~ ^/api/v1/accounts/[^/]+/(followers|following|relationship)$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /api/v1/accounts/relationships {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # API and ActivityPub routes -> backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /.well-known/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 完全Rust化ロードマップ (strangler fig) Stage 4。inbox (POST、HTTP Signature
        # 検証・レート制限・Follow/Accept/Reject/Block/Delete/Flag/Undo(Follow/Block)
        # ディスパッチ)。Create/Like/EmojiReact/Announce/Update/Moveは引き続きPython側
        # (Note受信基盤が前提のため未移植、backend-rs側は該当activity種別を
        # ログのみ出して優雅に無視する)。
        location ~ ^/users/[^/]+/inbox$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /inbox {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Actor本体 (`/users/{username}`)。
        location ~ ^/users/[^/]+$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # get_outbox/get_featured/get_followers_collection/get_following_collection。
        location ~ ^/users/[^/]+/(outbox|followers|following|featured)$ {
            proxy_pass http://backend-rs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /users/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Notes: ActivityPubリクエストはバックエンドへ、ブラウザはSPA静的ファイルへ
        location /notes/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            if ($http_accept ~* "application/(activity\+json|ld\+json)") {
                proxy_pass http://backend;
                break;
            }

            try_files $uri /index.html;
        }

        location /nodeinfo/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /favicon.ico {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /manifest.webmanifest {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location ^~ /oauth/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Media files -> s3proxy-deliverer (direct filesystem access via UDS)
        location /media/ {
            rewrite ^/media/(.*)$ /nekonoverse/$1 break;
            proxy_pass http://s3proxy-deliverer;
            proxy_set_header Host $host;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            # location 内で add_header を使うと http レベルのヘッダーが継承されないため再指定する。
            # ユーザーがアップロードしたファイルなので、文書として開かれてもスクリプト等を実行させない
            add_header Cache-Control "public, max-age=86400, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_buffering on;
        }

        # Service Worker
        location = /sw.js {
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            return 200 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c)}))}))});';
        }

        # M-16: ハッシュ付き静的アセット -- 長期キャッシュ
        location ~* \.(js|css|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # Everything else -> SPA static files
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
